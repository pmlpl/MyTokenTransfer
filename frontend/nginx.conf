worker_processes  auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200m;

    # —— 压缩：Vite 产物单个 chunk 就 350KB+，不压跨 Tailscale 首屏要等好几秒 ——
    # 实测主包 373KB → gzip 后 116KB（省 69%）。
    # woff2 / png 本身已压缩，不列入 gzip_types 免得白耗 CPU。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root   /usr/share/nginx/html;
        index  index.html;

        # 跳转一律用相对地址。前面的 TLS 终止方（tailscale serve / 任意反代）
        # 会把请求以 http 转发进来，nginx 默认按自身 scheme 拼出
        # http://<host>/xxx 这种绝对地址 —— 浏览器跟随后就掉了 https 和端口。
        # 改成相对跳转，由浏览器保留当前 scheme/端口。
        absolute_redirect off;
        port_in_redirect   off;

        # —— /v1 是 API 前缀，不是一个页面 ——
        # nginx 对 `location /v1/` 会先把 /v1 301 到 /v1/，而 /v1/ 转给后端是 404。
        # 浏览器直接访问 /v1 只会看到报错。这里直接给一句 JSON 说明，省掉那次跳转。
        location = /v1 {
            default_type application/json;
            return 404 '{"error":{"message":"/v1 是 API 前缀，不是页面。请调用具体端点：GET /v1/models，POST /v1/chat/completions","type":"invalid_request_error"}}';
        }

        # —— 后端反向代理：前端 VITE_API_BASE=/api ——
        # 匹配 /api/xxx 时去掉 /api 前缀再转发到 backend:8082
        location /api/ {
            rewrite ^/api/(.*)$  /$1  break;
            proxy_pass http://backend:8082;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE/流式响应（/v1/chat/completions 支持 stream）
            proxy_set_header Connection      '';
            proxy_buffering                  off;
            proxy_cache                      off;
            proxy_read_timeout               900s;
            proxy_send_timeout               900s;
            chunked_transfer_encoding        on;
        }

        # —— 直连网关路径：外部用户可通过 http://<host>:8080/v1/* 调 OpenAI 兼容 API
        #    省去单独暴露 8082 端口（若需要可改 compose 映射）
        location /v1/ {
            proxy_pass http://backend:8082;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection      '';
            proxy_buffering                  off;
            proxy_cache                      off;
            proxy_read_timeout               900s;
            proxy_send_timeout               900s;
            chunked_transfer_encoding        on;
        }

        # —— SPA history 路由兜底 ——
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源强缓存
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
}
