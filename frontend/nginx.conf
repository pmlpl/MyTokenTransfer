worker_processes  auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    server {
        listen 80;
        server_name _;
        root   /usr/share/nginx/html;
        index  index.html;

        # —— 后端反向代理：前端 VITE_API_BASE=/api ——
        # 匹配 /api/xxx 时去掉 /api 前缀再转发到 backend:8082
        location /api/ {
            rewrite ^/api/(.*)$  /$1  break;
            proxy_pass http://backend:8082;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE/流式响应（/v1/chat/completions 支持 stream）
            proxy_set_header Connection      '';
            proxy_buffering                  off;
            proxy_cache                      off;
            proxy_read_timeout               600s;
            proxy_send_timeout               600s;
            chunked_transfer_encoding        on;
        }

        # —— 直连网关路径：外部用户可通过 http://<host>:8080/v1/* 调 OpenAI 兼容 API
        #    省去单独暴露 8082 端口（若需要可改 compose 映射）
        location /v1/ {
            proxy_pass http://backend:8082;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection      '';
            proxy_buffering                  off;
            proxy_cache                      off;
            proxy_read_timeout               600s;
            proxy_send_timeout               600s;
            chunked_transfer_encoding        on;
        }

        # —— SPA history 路由兜底 ——
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源强缓存
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
}
