[project]
name = "mytokentransfer-backend"
version = "0.1.0"
description = "API key management + OpenAI-compatible relay gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "cryptography>=42",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "apscheduler>=3.10",
    # Redis：session pin / 限流 / 热点缓存（async 支持，5.x 自带 asyncio API）
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
