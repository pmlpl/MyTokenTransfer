services:
  mysql:
    image: mysql:8.0
    container_name: mtt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-mytokentransfer}
      MYSQL_USER:          ${MYSQL_USER:-mtt}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-mttpass}
    ports:
      # 注意：Windows Docker Desktop 桥接网络下容器间互访常被隔离
      # 因此 backend 不走 `mysql:3306` 内网，而是通过 host.docker.internal:3307 经宿主机绕回
      # 这里不写 127.0.0.1 前缀，让 docker 绑定到 host-gateway（默认 0.0.0.0），
      # 这样 backend 容器内访问 host.docker.internal:3307 时能命中
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtt-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 让 backend 能通过 host.docker.internal 访问宿主机（Linux 下 Docker 也能解析）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # —— 数据库：Windows Docker Desktop 桥接容器间互访不通，经宿主机绕回 ——
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-mtt}:${MYSQL_PASSWORD:-mttpass}@host.docker.internal:3307/${MYSQL_DATABASE:-mytokentransfer}

      # —— 必须从根 .env 注入（示例见 .env.example）——
      MASTER_PASSWORD: ${MASTER_PASSWORD:?请在根 .env 设置 MASTER_PASSWORD}
      SECRET_KEY:      ${SECRET_KEY:?请在根 .env 设置 SECRET_KEY}
      GATEWAY_TOKEN:   ${GATEWAY_TOKEN:?请在根 .env 设置 GATEWAY_TOKEN}
      ENCRYPTION_KEY:  ${ENCRYPTION_KEY:-}

      # —— 登录态有效期（秒）默认 7 天 ——
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800}

      # —— Redis（session pin / 限流 / 热点缓存）——
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # —— CORS：同源反代只需允许前端 http 地址；若要额外放行直连 8082 端口可自行追加 ——
      CORS_ORIGINS: >-
        [
          "http://127.0.0.1:8080",
          "http://localhost:8080",
          "http://127.0.0.1:5173",
          "http://localhost:5173",
          "http://127.0.0.1:5174",
          "http://localhost:5174",
          "http://127.0.0.1:5175",
          "http://localhost:5175"
        ]
    # uvicorn 在容器里监听 8082，只在 compose 网络内部暴露；nginx 通过 service 名 `backend` 访问
    expose:
      - "8082"
    # （可选）直接映射宿主端口，方便绕过 nginx 调试 API
    # ports:
    #   - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtt-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 对外入口：http://127.0.0.1:8080
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mtt-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在根 .env 设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"               # 持久化；pin / 限流状态重启不丢
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru         # 内存满时按 LRU 淘汰，对 pin 这种短 TTL 友好
    ports:
      - "127.0.0.1:6379:6379"   # 仅宿主机可连；容器间走 service 名
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
