services:
  mysql:
    image: mysql:8.0
    container_name: mtt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-mytokentransfer}
      MYSQL_USER:          ${MYSQL_USER:-mtt}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-mttpass}
    ports:
      # 注意：Windows Docker Desktop 桥接网络下容器间互访常被隔离
      # 因此 backend 不走 `mysql:3306` 内网，而是通过 host.docker.internal:3307 经宿主机绕回
      # 这里不写 127.0.0.1 前缀，让 docker 绑定到 host-gateway（默认 0.0.0.0），
      # 这样 backend 容器内访问 host.docker.internal:3307 时能命中
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtt-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 让 backend 能通过 host.docker.internal 访问宿主机（Linux 下 Docker 也能解析）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # —— 数据库：Windows Docker Desktop 桥接容器间互访不通，经宿主机绕回 ——
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-mtt}:${MYSQL_PASSWORD:-mttpass}@host.docker.internal:3307/${MYSQL_DATABASE:-mytokentransfer}

      # —— 必须从根 .env 注入（示例见 .env.example）——
      MASTER_PASSWORD: ${MASTER_PASSWORD:?请在根 .env 设置 MASTER_PASSWORD}
      SECRET_KEY:      ${SECRET_KEY:?请在根 .env 设置 SECRET_KEY}
      GATEWAY_TOKEN:   ${GATEWAY_TOKEN:?请在根 .env 设置 GATEWAY_TOKEN}
      ENCRYPTION_KEY:  ${ENCRYPTION_KEY:-}

      # —— 登录态有效期（秒）默认 7 天 ——
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800}

      # —— Redis（session pin / 限流 / 热点缓存）——
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # —— 令牌桶限流：RPM 按请求数、TPM 按 token 数 ——
      # RPM：SenseNova 免费层未公布，20 太高触发 EndpointRPMExceeded，DeepSeek-Flash 降到 5
      MTT_TOKEN_BUCKET_MODEL_RPM: ${MTT_TOKEN_BUCKET_MODEL_RPM:-deepseek-flash:5}
      # TPM：不再用固定令牌桶（单次 agent 请求 30 万+ token，桶容量装不下
      # 任何一条真实请求 → 恒空 → 恒放行 → 完全失效）。改为滚动 60 秒窗口
      # + 自适应预算，这里的值只是自学习起点与上下限，不是硬上限。
      MTT_TOKEN_BUCKET_TPM: ${MTT_TOKEN_BUCKET_TPM:-400000}
      MTT_TOKEN_BUCKET_TPM_MIN: ${MTT_TOKEN_BUCKET_TPM_MIN:-50000}
      MTT_TOKEN_BUCKET_TPM_MAX: ${MTT_TOKEN_BUCKET_TPM_MAX:-4000000}
      # 预算不足时最多等多少秒再发；超过则直接 429 + 精确 Retry-After
      MTT_TOKEN_BUCKET_TPM_MAX_WAIT: ${MTT_TOKEN_BUCKET_TPM_MAX_WAIT:-8}
      # 按原生模型覆盖预算种子，格式 "glm-5.2:800000,deepseek-flash:100000"
      MTT_TOKEN_BUCKET_MODEL_TPM: ${MTT_TOKEN_BUCKET_MODEL_TPM:-}

      # —— CORS：同源反代只需允许前端 http 地址；若要额外放行直连 8082 端口可自行追加 ——
      CORS_ORIGINS: >-
        [
          "http://127.0.0.1:8080",
          "http://localhost:8080",
          "http://127.0.0.1:5173",
          "http://localhost:5173",
          "http://127.0.0.1:5174",
          "http://localhost:5174",
          "http://127.0.0.1:5175",
          "http://localhost:5175"
        ]
    # uvicorn 在容器里监听 8082，只在 compose 网络内部暴露；nginx 通过 service 名 `backend` 访问
    expose:
      - "8082"
    # （可选）直接映射宿主端口，方便绕过 nginx 调试 API
    # ports:
    #   - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtt-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 对外入口：http://127.0.0.1:8080
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mtt-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在根 .env 设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"               # 持久化；pin / 限流状态重启不丢
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru         # 内存满时按 LRU 淘汰，对 pin 这种短 TTL 友好
    ports:
      # 仅宿主可连，方便本地调试；容器间一律走 service 名 redis:6379，不经过这里。
      # 宿主端口用 6380 避开本机其他 Redis（如 6379 已被别的项目占用）。
      # 注意：换的是**宿主端口**，不是 Redis 库号（/0 /1 /2 是同一个实例里的逻辑库，共用同一端口）。
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
